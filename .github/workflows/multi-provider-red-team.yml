name: Manual multi-provider Guardrail Lab

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider adapter to test"
        required: true
        type: choice
        options:
          - openai
          - anthropic
          - gemini
          - deepseek
          - glm
          - moonshot
          - nvidia
          - openrouter
          - groq
          - together
          - openai-compatible
      model:
        description: "Exact model identifier for the selected provider"
        required: true
        type: string
      base_url:
        description: "HTTPS base URL reachable by the GitHub-hosted runner (required for openai-compatible)"
        required: false
        type: string
      scope:
        description: "Case set: all 76, core 24, or source-derived 52"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - core
          - source
      mode:
        description: "Full suite runs every selected case once; campaign uses a request budget"
        required: true
        default: "campaign"
        type: choice
        options:
          - campaign
          - full_suite
      budget:
        description: "Campaign request budget only (1-1000; ignored for full_suite)"
        required: true
        default: "24"
        type: string

permissions:
  contents: read

concurrency:
  group: openmind-multi-provider-${{ inputs.provider }}-${{ inputs.scope }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate run configuration
        env:
          BUDGET: ${{ inputs.budget }}
          MODE: ${{ inputs.mode }}
          SCOPE: ${{ inputs.scope }}
        run: |
          case "$SCOPE" in all|core|source) ;; *) echo "Invalid scope"; exit 2 ;; esac
          case "$MODE" in campaign|full_suite) ;; *) echo "Invalid mode"; exit 2 ;; esac
          if [ "$MODE" = "campaign" ]; then
            case "$BUDGET" in
              ''|*[!0-9]*) echo "Budget must be an integer from 1 to 1000"; exit 2 ;;
            esac
            if [ "$BUDGET" -lt 1 ] || [ "$BUDGET" -gt 1000 ]; then
              echo "Budget must be an integer from 1 to 1000"; exit 2
            fi
          fi
      - name: Validate endpoint configuration
        env:
          PROVIDER: ${{ inputs.provider }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          if [ "$PROVIDER" = "openai-compatible" ]; then
            if [ -z "$BASE_URL" ]; then
              echo "openai-compatible requires an HTTPS base_url reachable from this GitHub-hosted runner."
              exit 2
            fi
            case "$BASE_URL" in
              https://*) ;;
              *) echo "Custom endpoints must use HTTPS on GitHub-hosted runners."; exit 2 ;;
            esac
          fi
      - name: Configure selected provider credentials
        env:
          PROVIDER: ${{ inputs.provider }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          MOONSHOT_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          case "$PROVIDER" in
            openai) test -n "$OPENAI_KEY" || { echo "Missing OPENAI_API_KEY Actions secret"; exit 2; }; echo "::add-mask::$OPENAI_KEY"; echo "OPENAI_API_KEY=$OPENAI_KEY" >> "$GITHUB_ENV" ;;
            anthropic) test -n "$ANTHROPIC_KEY" || { echo "Missing ANTHROPIC_API_KEY Actions secret"; exit 2; }; echo "::add-mask::$ANTHROPIC_KEY"; echo "ANTHROPIC_API_KEY=$ANTHROPIC_KEY" >> "$GITHUB_ENV" ;;
            gemini) test -n "$GEMINI_KEY" || { echo "Missing GEMINI_API_KEY Actions secret"; exit 2; }; echo "::add-mask::$GEMINI_KEY"; echo "GEMINI_API_KEY=$GEMINI_KEY" >> "$GITHUB_ENV" ;;
            deepseek) test -n "$DEEPSEEK_KEY" || { echo "Missing DEEPSEEK_API_KEY Actions secret"; exit 2; }; echo "::add-mask::$DEEPSEEK_KEY"; echo "DEEPSEEK_API_KEY=$DEEPSEEK_KEY" >> "$GITHUB_ENV" ;;
            glm) test -n "$GLM_KEY" || { echo "Missing ZHIPUAI_API_KEY Actions secret"; exit 2; }; echo "::add-mask::$GLM_KEY"; echo "ZHIPUAI_API_KEY=$GLM_KEY" >> "$GITHUB_ENV" ;;
            moonshot) test -n "$MOONSHOT_KEY" || { echo "Missing MOONSHOT_API_KEY Actions secret"; exit 2; }; echo "::add-mask::$MOONSHOT_KEY"; echo "MOONSHOT_API_KEY=$MOONSHOT_KEY" >> "$GITHUB_ENV" ;;
            nvidia) test -n "$NVIDIA_KEY" || { echo "Missing NVIDIA_API_KEY Actions secret"; exit 2; }; echo "::add-mask::$NVIDIA_KEY"; echo "NVIDIA_API_KEY=$NVIDIA_KEY" >> "$GITHUB_ENV" ;;
            openrouter) test -n "$OPENROUTER_KEY" || { echo "Missing OPENROUTER_API_KEY Actions secret"; exit 2; }; echo "::add-mask::$OPENROUTER_KEY"; echo "OPENROUTER_API_KEY=$OPENROUTER_KEY" >> "$GITHUB_ENV" ;;
            groq) test -n "$GROQ_KEY" || { echo "Missing GROQ_API_KEY Actions secret"; exit 2; }; echo "::add-mask::$GROQ_KEY"; echo "GROQ_API_KEY=$GROQ_KEY" >> "$GITHUB_ENV" ;;
            together) test -n "$TOGETHER_KEY" || { echo "Missing TOGETHER_API_KEY Actions secret"; exit 2; }; echo "::add-mask::$TOGETHER_KEY"; echo "TOGETHER_API_KEY=$TOGETHER_KEY" >> "$GITHUB_ENV" ;;
            openai-compatible) echo "OpenAI-compatible endpoint selected; OPENAI_COMPAT_API_KEY is optional for unauthenticated endpoints." ;;
          esac
      - name: Run selected provider and case set
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          BASE_URL: ${{ inputs.base_url }}
          SCOPE: ${{ inputs.scope }}
          MODE: ${{ inputs.mode }}
          BUDGET: ${{ inputs.budget }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
        run: |
          mkdir -p reports
          if [ -n "$OPENAI_COMPAT_API_KEY" ]; then
            echo "::add-mask::$OPENAI_COMPAT_API_KEY"
            export OPENAI_COMPAT_API_KEY
          fi
          ARGS=(--provider "$PROVIDER" --model "$MODEL" --output "reports/$PROVIDER-red-team.json" --delay 1)
          case "$SCOPE" in
            source) ARGS+=(--source-corpus) ;;
            core)
              for n in $(seq 1 24); do printf -v case_id "GL-%03d" "$n"; ARGS+=(--case "$case_id"); done
              ;;
            all) ;;
          esac
          if [ "$MODE" = "campaign" ]; then
            ARGS+=(--campaign --budget "$BUDGET" --variants 6 --max-seconds 2400)
          fi
          if [ -n "$BASE_URL" ]; then ARGS+=(--base-url "$BASE_URL"); fi
          python -m modules.guardrail_lab "${ARGS[@]}"
      - name: Validate evidence and source provenance
        if: success()
        env:
          PROVIDER: ${{ inputs.provider }}
          SCOPE: ${{ inputs.scope }}
          MODE: ${{ inputs.mode }}
          BUDGET: ${{ inputs.budget }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("reports") / f"{os.environ['PROVIDER']}-red-team.json"
          report = json.loads(p.read_text())
          results = report.get("results", [])
          if not results:
              raise SystemExit("Evidence report contains no results")
          expected = (
              {f"GL-{n:03d}" for n in range(1, 25)} if os.environ["SCOPE"] == "core"
              else {f"GL-SRC-{n:03d}" for n in range(1, 53)} if os.environ["SCOPE"] == "source"
              else ({f"GL-{n:03d}" for n in range(1, 25)} |
                    {f"GL-SRC-{n:03d}" for n in range(1, 53)})
          )
          actual = {item.get("case_id") for item in results}
          if not actual.issubset(expected):
              raise SystemExit(f"Unexpected case IDs: {sorted(actual - expected)}")
          if os.environ["MODE"] == "full_suite":
              if actual != expected or len(results) != len(expected):
                  raise SystemExit(f"Expected all {len(expected)} cases once; got {len(results)}")
          elif len(results) > int(os.environ["BUDGET"]):
              raise SystemExit("Campaign exceeded its configured request budget")
          for item in results:
              if not item.get("case_id"):
                  raise SystemExit("A result is missing its case ID")
              if item["case_id"].startswith("GL-SRC-"):
                  provenance = item.get("source_provenance", {})
                  if not provenance.get("source_id") or len(provenance.get("source_sha256", "")) != 64:
                      raise SystemExit(f"Missing source provenance for {item['case_id']}")
          print(json.dumps({"provider": report.get("provider"), "model": report.get("model"), "result_count": len(results), "scope": os.environ["SCOPE"], "mode": os.environ["MODE"], "summary": report.get("summary", {})}, indent=2))
          PY
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openmind-${{ inputs.provider }}-${{ inputs.scope }}-${{ inputs.mode }}-evidence
          path: reports/*-red-team.json
          if-no-files-found: ignore
          retention-days: 14
