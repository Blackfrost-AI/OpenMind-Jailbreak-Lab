name: Validate benchmark
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate benchmark
        run: |
          python -m src.validate data/benchmark_v0.3.jsonl
          python -m src.validate data/benchmark_v0.4.jsonl
          python -m src.validate data/benchmark_v0.5.jsonl
          python -m src.validate data/benchmark_v0.6.jsonl
          python -m src.validate data/benchmark_v0.6.1.jsonl
      - name: Smoke-test JB-002 module
        run: |
          python -m modules.jb002 list
          python -m modules.jb002 prompt JB002-01
          python -m modules.jb002 validate
          python -m modules.jb002 report
      - name: Smoke-test AI scanner module
        run: python -m modules.ai_scanner --help
      - name: Smoke-test Guardrail Lab module
        run: python -m modules.guardrail_lab --list
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
