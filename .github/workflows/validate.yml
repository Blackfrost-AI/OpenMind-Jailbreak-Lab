name: Validate benchmark
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate benchmark
        run: python -m src.validate data/benchmark_v0.3.jsonl
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
