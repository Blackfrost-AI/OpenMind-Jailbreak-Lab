name: Manual Gemini full 76-case Guardrail Lab suite

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model identifier available to your API key"
        required: true
        default: "gemini-3.5-flash-lite"

permissions:
  contents: read

concurrency:
  group: openmind-gemini-full-red-team
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify case inventory
        run: |
          python -m modules.guardrail_lab --list
      - name: Run full bounded live suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing GEMINI_API_KEY. Add it under Settings > Secrets and variables > Actions."
            exit 2
          fi
          mkdir -p reports
          python -m modules.guardrail_lab \
            --provider gemini \
            --model "$MODEL" \
            --delay 13.0 \
            --output reports/gemini-full-red-team.json
      - name: Validate evidence completeness
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/gemini-full-red-team.json").read_text())
          expected = ({f"GL-{n:03d}" for n in range(1, 25)} |
                      {f"GL-SRC-{n:03d}" for n in range(1, 53)})
          results = report.get("results", [])
          actual = {item.get("case_id") for item in results}
          if actual != expected or len(results) != 76:
              raise SystemExit(
                  f"Expected 76 unique cases (24 core + 52 source-derived); "
                  f"got {len(results)} results: {sorted(actual)}"
              )
          for item in results:
              if item["case_id"].startswith("GL-SRC-"):
                  provenance = item.get("source_provenance", {})
                  if not provenance.get("source_id") or len(provenance.get("source_sha256", "")) != 64:
                      raise SystemExit(f"Missing source provenance for {item['case_id']}")
          if any(not item.get("started_at") for item in results):
              raise SystemExit("One or more result records lack timestamps")
          print(json.dumps(report.get("summary", {}), indent=2))
          PY
      - name: Upload live evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openmind-gemini-full-red-team-evidence
          path: reports/gemini-full-red-team.json
          if-no-files-found: ignore
          retention-days: 14
